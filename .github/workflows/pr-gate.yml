# Merge is governed by branch protection on main (required checks: test, apps, factory/review).
# The reviewer enables auto-merge. There is no label or human approval gate.
name: PR gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require branch up to date with main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Branch is behind main. Merge main and rerun."
            exit 1
          fi
