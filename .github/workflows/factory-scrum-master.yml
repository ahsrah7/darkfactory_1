name: Factory scrum master

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-scrum-master
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Queue tracker work and assign coding agents
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISPATCH_ENABLED: ${{ vars.DISPATCH_ENABLED }}
          BUDGET_SPENT_USD: ${{ vars.BUDGET_SPENT_USD }}
        run: node .github/factory/scripts/dispatch.cjs
